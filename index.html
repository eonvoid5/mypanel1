<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID HOST — Minecraft Control Center</title>
<link rel="stylesheet" href="styles.css">
<style>
.world{background:linear-gradient(#102e20 0 38%,#1c472c 38% 53%,#08130c);overflow:hidden}.world:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 12%,#d8ffc766,transparent 16%),linear-gradient(#68c28c18,#020805d9),repeating-linear-gradient(90deg,transparent 0 48px,#0003 49px 53px);filter:saturate(1.2)}.world:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(165deg,transparent 0 34%,#07150c99 35%),radial-gradient(ellipse at 30% 100%,#4dff8d28,transparent 42%);backdrop-filter:blur(1px)}.mc-tree{position:absolute;bottom:-35px;width:130px;height:300px;background:linear-gradient(90deg,#0a2113,#285e38,#0a1e11);box-shadow:0 -120px 0 40px #1e5230,0 -175px 0 68px #2a693e;opacity:.75}.tree-a{left:4%}.tree-b{left:28%;transform:scale(.62)}.tree-c{right:3%;height:350px}.tree-d{right:26%;transform:scale(.72)}
.modal{position:fixed;inset:0;background:#0008;backdrop-filter:blur(9px);display:none;place-items:center;z-index:100}.modal.open{display:grid}.modal-box{width:min(560px,calc(100% - 28px));padding:22px}.modal-box h2{margin-top:0}.close{float:right}.search-results{max-height:300px;overflow:auto}.shortcut{display:flex;justify-content:space-between;padding:10px;border-radius:11px}.shortcut:hover{background:#fff1}
</style>
</head>
<body>
<div class="world"><div class="mc-tree tree-a"></div><div class="mc-tree tree-b"></div><div class="mc-tree tree-c"></div><div class="mc-tree tree-d"></div></div>
<aside class="sidebar glass">
 <div class="brand"><div class="logo">V</div><div><b>VOID HOST</b><small class="muted">Minecraft Control Center</small></div></div>
 <div class="section-title">CLIENT</div><nav class="nav" id="clientNav"></nav>
 <div class="section-title">MANAGEMENT</div><nav class="nav" id="manageNav"></nav>
 <div class="section-title">ADMIN</div><nav class="nav" id="adminNav"></nav>
</aside>
<main class="main">
 <header class="top glass"><div class="crumb">VOID HOST / <b id="crumb">Overview</b></div><div class="actions"><button class="btn" id="searchBtn">⌕ Search</button><button class="btn" id="themeBtn">◐</button><button class="btn primary" id="createBtn">＋ Create Server</button></div></header>
 <div class="content" id="content"></div>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box glass"><button class="btn close" id="closeModal">×</button><h2 id="modalTitle">Create Server</h2><div id="modalBody"></div></div></div>
<script>
const client=[['overview','⌂','Overview'],['servers','▣','My Servers'],['console','▤','Console'],['files','⌘','Files'],['databases','◉','Databases'],['schedules','◷','Schedules'],['users','♙','Users'],['backups','◫','Backups'],['network','⌁','Network'],['startup','▶','Startup'],['settings','⚙','Settings'],['activity','≋','Activity']];
const manage=[['plugins','✦','Plugin Manager'],['mods','◇','Mod Manager'],['modpacks','▧','Modpack Manager'],['pro','◆','Pro Tools'],['billing','$','Billing'],['support','?','Support']];
const admin=[['admin-overview','⌂','Overview'],['admin-servers','▣','Servers'],['nodes','⬡','Nodes / Wings'],['locations','⌖','Locations'],['allocations','⌁','Allocations / Ports'],['admin-users','♙','Users'],['nests','◈','Nests'],['eggs','◉','Eggs'],['mounts','▤','Mounts'],['api','⌘','API Keys'],['admin-settings','⚙','Settings'],['audit','≋','Activity / Audit'],['system','◫','System / Queue']];
function nav(el,items){el.innerHTML=items.map(x=>`<button data-page="${x[0]}"><i>${x[1]}</i><span>${x[2]}</span></button>`).join('')}
nav(clientNav,client);nav(manage,manage);nav(adminNav,admin);
let state={serverId:1,status:'online',cpu:38,players:46};
const servers=[{id:1,name:'Survival SMP',address:'play.voidhost.net:25565',type:'Paper 1.21.4',node:'Node Alpha',cpu:38,ram:'4.8 GB',disk:'21.4 GB',players:46},{id:2,name:'Skyblock Network',address:'sky.voidhost.net:25565',type:'Purpur 1.21.4',node:'Node Beta',cpu:17,ram:'5.8 GB',disk:'31.2 GB',players:28},{id:3,name:'Modded Forge',address:'forge.voidhost.net:25565',type:'Forge 1.20.1',node:'Node Gamma',cpu:41,ram:'7.1 GB',disk:'54.1 GB',players:12}];
const labels=Object.fromEntries([...client,...manage,...admin].map(x=>[x[0],x[2]]));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),1800)}
const toastEl=document.getElementById('toast');
function shell(title,body,actions=''){return `<section><div class="section"><h2>${title}</h2><div class="actions">${actions}</div></div>${body}</section>`}
function table(headers,rows){return `<div class="glass card table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function overview(){let s=servers.find(x=>x.id===state.serverId)||servers[0];return `<section><div class="glass hero"><h1>Welcome back, Admin.</h1><p class="muted">Your Minecraft infrastructure at a glance.</p><div class="server glass"><div class="identity"><div class="cube">🌲</div><div><b>${s.name}</b><div class="muted">${s.address} · ${s.type} · ${s.node}</div></div></div><div class="actions"><span class="badge"><i class="dot ${state.status==='online'?'':'off'}"></i>${state.status.toUpperCase()}</span><button class="btn primary" data-power="start">Start</button><button class="btn" data-power="restart">Restart</button><button class="btn warn" data-power="stop">Stop</button><button class="btn danger" data-power="kill">Kill</button></div></div></div><div class="stats"><div class="glass card"><div class="label">CPU</div><div class="value">${s.cpu}%</div><div class="meter"><i style="width:${s.cpu}%"></i></div></div><div class="glass card"><div class="label">Memory</div><div class="value">${s.ram}</div><div class="muted">of 12 GB</div><div class="meter"><i style="width:40%"></i></div></div><div class="glass card"><div class="label">Disk</div><div class="value">${s.disk}</div><div class="muted">of 80 GB</div><div class="meter"><i style="width:27%"></i></div></div><div class="glass card"><div class="label">Players</div><div class="value">${s.players}</div><div class="muted">of 100 slots</div><div class="meter"><i style="width:${s.players}%"></i></div></div></div><div class="tabs glass">${client.slice(2).map(x=>`<button data-page="${x[0]}">${x[2]}</button>`).join('')}</div><div class="grid"><div class="glass card"><div class="label">LIVE CPU TELEMETRY</div><svg viewBox="0 0 700 190" width="100%" height="190"><path d="M0 142 C60 122 70 151 130 117 S220 133 270 82 S360 107 410 66 S510 102 570 52 S650 88 700 43" fill="none" stroke="#72ff9f" stroke-width="3"/></svg></div><div class="glass card"><div class="label">CONNECTION</div><div class="value">24 ms</div><p class="muted">Wings healthy · IN-01</p><div class="notice">SFTP<br>sftp.voidhost.net:2022</div></div></div></section>`}
function serversPage(){return shell('My Servers',`<div class="grid3">${servers.map(s=>`<div class="glass card"><div class="badge"><i class="dot"></i> ONLINE</div><h2>${s.name}</h2><p class="muted">${s.address}</p><p>CPU <b>${s.cpu}%</b> · RAM <b>${s.ram}</b></p><button class="btn primary" data-select="${s.id}">Manage</button></div>`).join('')}</div>`,'<button class="btn primary" id="createInline">＋ Create Server</button>')}
function consolePage(){return shell('Server Console',`<div class="glass card"><div class="terminal" id="terminal"><div>[18:47:02] <span class="ok">[INFO]</span> Starting Minecraft 1.21.4</div><div>[18:47:08] <span class="ok">[INFO]</span> Done (1.842s)!</div><div>[18:47:12] <span class="ok">[INFO]</span> Player joined the game</div><div>[18:48:01] <span class="warn">[WARN]</span> Can't keep up! Is the server overloaded?</div></div><form class="form" id="consoleForm"><input class="input" id="command" placeholder="Type a server command..." required><button class="btn primary">Send</button></form></div>`,'<button class="btn" id="clearConsole">Clear</button>')}
function filesPage(){return shell('File Manager',`<div class="glass card"><div class="notice">/home/container</div><div class="rows"><div class="row"><b>📁 plugins</b><button class="btn">Open</button></div><div class="row"><b>📁 world</b><button class="btn">Open</button></div><div class="row"><b>📄 server.properties</b><span class="muted">1.8 KB</span><button class="btn">Edit</button></div><div class="row"><b>📄 paper-global.yml</b><span class="muted">12 KB</span><button class="btn">Edit</button></div></div></div>`,'<button class="btn primary" data-msg="Upload dialog opened">Upload</button>')}
function generic(page){let title=labels[page]||page;let content={databases:table(['Name','Host','User','Status'],[['survival_main','mysql-01:3306','u_survival','Online'],['analytics','mysql-01:3306','u_metrics','Online']]),schedules:table(['Task','Frequency','Next Run','Status'],[['Restart server','Daily 04:00','Tomorrow','Enabled'],['Backup','Every 6 hours','22:00','Enabled'],['Cleanup logs','Weekly','Sunday','Enabled']]),users:table(['User','Role','2FA','Last Active'],[['Alex','Owner','Enabled','Now'],['Steve','Moderator','Enabled','4m ago'],['Mia','Member','Enabled','18m ago']]),backups:table(['Backup','Size','Created','Action'],[['world-2026-09-01','8.4 GB','Today 18:20','<button class="btn">Restore</button>'],['world-2026-08-31','8.1 GB','Yesterday','<button class="btn">Download</button>']]),network:table(['Allocation','IP','Port','Status'],[['Primary','0.0.0.0','25565','Assigned'],['Query','0.0.0.0','25575','Assigned']]),activity:`<div class="events glass card"><div class="event">Server started <span class="muted">Survival SMP</span><time>2m ago</time></div><div class="event">Backup completed <span class="muted">8.4 GB</span><time>28m ago</time></div><div class="event">User updated startup settings <span class="muted">Alex</span><time>1h ago</time></div></div>`,startup:`<div class="glass card formgrid"><div class="field"><label>Server Jar</label><select class="input"><option>Paper 1.21.4</option><option>Purpur 1.21.4</option></select></div><div class="field"><label>Java Version</label><select class="input"><option>Java 21</option><option>Java 17</option></select></div><div class="field"><label>Memory</label><input class="input" value="12288 MB"></div><div class="field"><label>Docker Image</label><input class="input" value="ghcr.io/pterodactyl/yolks:java_21"></div></div>`,settings:`<div class="glass card formgrid"><div class="field"><label>Server Name</label><input class="input" value="Survival SMP"></div><div class="field"><label>Timezone</label><select class="input"><option>Asia/Kolkata</option><option>UTC</option></select></div><div class="field"><label>Auto Restart</label><select class="input"><option>Enabled</option><option>Disabled</option></select></div><div class="field"><label>Player Slots</label><input class="input" value="100"></div></div>`,plugins:table(['Plugin','Version','Status','Action'],[['EssentialsX','2.21.0','Enabled','<button class="btn">Configure</button>'],['LuckPerms','5.4.145','Enabled','<button class="btn">Configure</button>'],['ViaVersion','5.2.1','Enabled','<button class="btn">Update</button>']]),mods:table(['Mod','Version','Loader','Status'],[['Lithium','0.14','Fabric','Enabled'],['FerriteCore','7.1','Fabric','Enabled']]),modpacks:table(['Pack','Version','Players','Action'],[['VoidCraft','1.4.2','46','<button class="btn">Manage</button>'],['SkyFactory','4.2','12','<button class="btn">Manage</button>']]),billing:`<div class="grid3"><div class="glass card"><div class="label">BALANCE</div><div class="value">$24.00</div></div><div class="glass card"><div class="label">NEXT RENEWAL</div><div class="value">Sep 30</div></div><div class="glass card"><div class="label">PLAN</div><div class="value">12 GB</div></div></div>`,support:`<div class="glass card"><h2>Support Center</h2><div class="notice">No open tickets. Create a ticket when you need help.</div><button class="btn primary" data-msg="Ticket composer opened">New Ticket</button></div>`,pro:`<div class="grid3"><div class="glass card"><h2>Server Cloner</h2><p class="muted">Clone configuration and files.</p><button class="btn primary" data-msg="Cloner opened">Open</button></div><div class="glass card"><h2>Resource Graphs</h2><p class="muted">Advanced CPU, RAM and disk telemetry.</p><button class="btn primary" data-msg="Graphs opened">Open</button></div><div class="glass card"><h2>Maintenance</h2><p class="muted">Schedule controlled maintenance.</p><button class="btn primary" data-msg="Maintenance opened">Open</button></div></div>`}[page];return shell(title,content||`<div class="glass card"><h2>${title}</h2><p class="muted">Management module ready for backend integration.</p><button class="btn primary" data-msg="${title} action opened">Open</button></div>`)}
function adminPage(page){let title=labels[page]||'Admin';let map={ 'admin-overview':`<div class="stats"><div class="glass card"><div class="label">SERVERS</div><div class="value">3</div></div><div class="glass card"><div class="label">USERS</div><div class="value">128</div></div><div class="glass card"><div class="label">NODES</div><div class="value">4</div></div><div class="glass card"><div class="label">ALLOCATIONS</div><div class="value">96</div></div></div>`, 'admin-servers':table(['Server','Owner','Node','Status'],servers.map(s=>[s.name,'Alex',s.node,'Online'])),nodes:table(['Node','Location','Wings','CPU','Status'],[['Node Alpha','Mumbai','1.11.13','38%','Healthy'],['Node Beta','Delhi','1.11.13','17%','Healthy'],['Node Gamma','Bangalore','1.11.13','41%','Healthy']]),locations:table(['Location','Nodes','Servers','Status'],[['Mumbai','2','41','Online'],['Delhi','1','27','Online'],['Bangalore','1','19','Online']]),allocations:table(['IP','Port','Server','Status'],[['0.0.0.0','25565','Survival SMP','Assigned'],['0.0.0.0','25566','Skyblock Network','Assigned']]),'admin-users':table(['User','Email','Servers','Role'],[['Alex','admin@voidhost.net','3','Admin'],['Steve','steve@voidhost.net','1','User']]),nests:table(['Nest','Eggs','Servers'],[['Minecraft','18','83'],['Proxy','4','12']]),eggs:table(['Egg','Nest','Image','Servers'],[['Paper','Minecraft','java_21','41'],['Forge','Minecraft','java_17','18']]),mounts:table(['Mount','Source','Read Only','Servers'],[['Plugins','/srv/plugins','No','41'],['Backups','/srv/backups','Yes','83']]),api:table(['Key','User','Created','Last Used'],[['vh_live_••••','Alex','Aug 20','Now'],['vh_read_••••','Steve','Aug 12','2h ago']]),'admin-settings':`<div class="glass card formgrid"><div class="field"><label>Panel Name</label><input class="input" value="VOID HOST"></div><div class="field"><label>Default Locale</label><select class="input"><option>English</option><option>Hindi</option></select></div><div class="field"><label>Registration</label><select class="input"><option>Enabled</option><option>Approval Required</option></select></div><div class="field"><label>Maintenance Mode</label><select class="input"><option>Disabled</option><option>Enabled</option></select></div></div>`,audit:`<div class="events glass card"><div class="event">Admin changed server allocation <time>2m ago</time></div><div class="event">Node Alpha heartbeat received <time>5m ago</time></div><div class="event">User approval completed <time>12m ago</time></div></div>`,system:`<div class="grid3"><div class="glass card"><div class="label">QUEUE</div><div class="value">0</div></div><div class="glass card"><div class="label">WINGS</div><div class="value">4 / 4</div></div><div class="glass card"><div class="label">TELEMETRY</div><div class="value">Healthy</div></div></div>`};return shell(title,map[page]||`<div class="glass card"><h2>${title}</h2><p class="muted">Administrative control surface.</p></div>`)}
function render(page='overview'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));crumb.textContent=labels[page]||page;content.innerHTML=page==='overview'?overview():page==='servers'?serversPage():page==='console'?consolePage():page==='files'?filesPage():admin.includes?generic(page):generic(page);if(admin.some(x=>x[0]===page))content.innerHTML=adminPage(page);bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.serverId=+b.dataset.select;render('overview');toast('Server selected')});document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>toast(b.dataset.msg));document.querySelectorAll('[data-power]').forEach(b=>b.onclick=()=>power(b.dataset.power));document.getElementById('createInline')?.addEventListener('click',openCreate);document.getElementById('clearConsole')?.addEventListener('click',()=>document.getElementById('terminal').innerHTML='');document.getElementById('consoleForm')?.addEventListener('submit',sendCommand)}
async function power(action){let s=servers.find(x=>x.id===state.serverId);if(!s)return;try{let r=await fetch(`/api/servers/${s.id}/power`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(r.ok){let d=await r.json();state.status=d.status;toast(action==='start'?'Server started':action==='stop'?'Server stopped':action==='kill'?'Server killed':'Server restarted')}else throw Error()}catch(e){state.status=action==='start'||action==='restart'?'online':'offline';toast('Power action applied locally')}render('overview')}
async function sendCommand(e){e.preventDefault();let input=document.getElementById('command'),cmd=input.value.trim();if(!cmd)return;let t=document.getElementById('terminal');t.innerHTML+=`<div>&gt; ${esc(cmd)}</div>`;input.value='';t.scrollTop=t.scrollHeight;try{await fetch('/api/console',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})})}catch(e){}}
function openCreate(){modal.classList.add('open');modalTitle.textContent='Create Server';modalBody.innerHTML='<div class="formgrid"><div class="field"><label>Server Name</label><input class="input" id="newName" placeholder="My Minecraft Server"></div><div class="field"><label>Software</label><select class="input"><option>Paper</option><option>Purpur</option><option>Forge</option><option>Fabric</option></select></div><div class="field"><label>Memory</label><input class="input" value="4096 MB"></div><div class="field"><label>Slots</label><input class="input" value="50"></div></div><button class="btn primary" style="margin-top:14px" id="saveServer">Create Server</button>';document.getElementById('saveServer').onclick=()=>{let n=document.getElementById('newName').value.trim();if(!n)return toast('Server name is required');servers.push({id:Date.now(),name:n,address:'pending.voidhost.net:25565',type:'Paper',node:'Node Alpha',cpu:0,ram:'4 GB',disk:'0 GB',players:0});modal.classList.remove('open');toast('Server created');render('servers')}}
searchBtn.onclick=()=>{modal.classList.add('open');modalTitle.textContent='Quick Search';modalBody.innerHTML='<input class="input" id="q" placeholder="Search servers, users, settings..." autofocus><div class="search-results" id="results">'+[...client,...manage,...admin].map(x=>`<div class="shortcut" data-search-page="${x[0]}"><span>${x[2]}</span><span class="muted">Open</span></div>`).join('')+'</div>';document.getElementById('q').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('[data-search-page]').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')};document.querySelectorAll('[data-search-page]').forEach(x=>x.onclick=()=>{modal.classList.remove('open');render(x.dataset.searchPage)})};
createBtn.onclick=openCreate;closeModal.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};themeBtn.onclick=()=>{document.body.classList.toggle('bright');toast('Visual mode toggled')};
render('overview');
</script></body></html>
