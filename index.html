d('consoleForm');if(f)f.onsubmit=async e=>{e.preventDefault();let c=document.getElementById('cmd').value.trim();if(!c)return;try{await fetch('/api/console',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:c})})}catch(e){}document.getElementById('log').insertAdjacentHTML('beforeend',`<div><span class="info">[Console]</span> &gt; ${c.replace(/[<>]/g,'')}</div>`);document.getElementById('cmd').value='';toast('Command sent')};let cl=document.getElementById('clear');if(cl)cl.onclick=()=>document.getElementById('log').innerHTML=''}open('overview');create.onclick=()=>toast('Create Server wizard opened');search.onclick=()=>toast('Global search opened');setInterval(()=>{let c=document.getElementById('cpu');if(c){let v=20+Math.floor(Math.random()*48);c.textContent=v+'%';document.getElementById('cpum').style.width=v+'%'}},2200);</script></body></html>
